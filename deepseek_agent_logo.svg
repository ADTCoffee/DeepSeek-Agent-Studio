<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c2a52"/>
      <stop offset="1" stop-color="#0b0f1a"/>
    </linearGradient>
    <linearGradient id="whale" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5c7cfa"/>
      <stop offset="1" stop-color="#2f5fe0"/>
    </linearGradient>
    <linearGradient id="tail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b5bdb"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>

  <rect x="20" y="20" width="472" height="472" rx="116" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="204" fill="none" stroke="#4d6bfe" stroke-width="8" opacity="0.35"/>
  <circle cx="256" cy="256" r="168" fill="none" stroke="#22d3ee" stroke-width="3" opacity="0.25" stroke-dasharray="4 14"/>

  <!-- whale body -->
  <ellipse cx="218" cy="266" rx="132" ry="84" fill="url(#whale)"/>
  <ellipse cx="224" cy="300" rx="104" ry="52" fill="#7c9cff" opacity="0.55"/>

  <!-- tail -->
  <path d="M292 238 C342 184 392 166 412 166 C392 220 378 248 348 266 C372 294 388 322 406 364 C382 360 340 342 304 300 Z" fill="url(#tail)"/>

  <!-- dorsal fin -->
  <path d="M154 202 C168 136 214 120 236 176 C214 184 184 188 154 202 Z" fill="#2f6df6"/>

  <!-- eye -->
  <circle cx="172" cy="250" r="18" fill="#ffffff"/>
  <circle cx="178" cy="254" r="9" fill="#0b0f1a"/>

  <!-- data node -->
  <circle cx="390" cy="118" r="34" fill="#22d3ee"/>
  <circle cx="390" cy="118" r="12" fill="#0b0f1a"/>
  <path d="M356 152 L386 122 M424 84 L390 118" stroke="#22d3ee" stroke-width="10" stroke-linecap="round"/>
</svg>
